! leaf6 | AS 65006 | VRFs: default, PROD, MGMT
!
hostname leaf6
!
username admin privilege 15 role network-admin secret admin
!
management ssh
   no shutdown
!
vrf instance PROD
vrf instance MGMT
!
interface Loopback0
   ip address 10.0.0.6/32
interface Loopback1
   ip address 10.0.1.6/32
interface Loopback2
   ip address 10.0.2.6/32
!
interface Loopback10
   vrf PROD
   ip address 10.10.0.6/32
interface Loopback11
   vrf PROD
   ip address 10.10.1.6/32
interface Loopback12
   vrf PROD
   ip address 10.10.2.6/32
!
interface Loopback20
   vrf MGMT
   ip address 10.20.0.6/32
interface Loopback21
   vrf MGMT
   ip address 10.20.1.6/32
interface Loopback22
   vrf MGMT
   ip address 10.20.2.6/32
!
interface Ethernet1
   description leaf6->leaf1
   no switchport
   ip address 10.1.16.2/30
!
interface Ethernet2
   description leaf6->leaf2
   no switchport
   ip address 10.1.26.2/30
!
interface Ethernet3
   description leaf6->leaf3
   no switchport
   ip address 10.1.36.2/30
!
interface Ethernet4
   description leaf6->leaf4
   no switchport
   ip address 10.1.46.2/30
!
interface Ethernet5
   description leaf6->leaf5
   no switchport
   ip address 10.1.56.2/30
!
interface Ethernet1.10
   description leaf6->leaf1 PROD
   encapsulation dot1q vlan 10
   vrf PROD
   ip address 10.11.16.2/30
!
interface Ethernet2.10
   description leaf6->leaf2 PROD
   encapsulation dot1q vlan 10
   vrf PROD
   ip address 10.11.26.2/30
!
interface Ethernet3.10
   description leaf6->leaf3 PROD
   encapsulation dot1q vlan 10
   vrf PROD
   ip address 10.11.36.2/30
!
interface Ethernet4.10
   description leaf6->leaf4 PROD
   encapsulation dot1q vlan 10
   vrf PROD
   ip address 10.11.46.2/30
!
interface Ethernet5.10
   description leaf6->leaf5 PROD
   encapsulation dot1q vlan 10
   vrf PROD
   ip address 10.11.56.2/30
!
interface Ethernet1.20
   description leaf6->leaf1 MGMT
   encapsulation dot1q vlan 20
   vrf MGMT
   ip address 10.21.16.2/30
!
interface Ethernet2.20
   description leaf6->leaf2 MGMT
   encapsulation dot1q vlan 20
   vrf MGMT
   ip address 10.21.26.2/30
!
interface Ethernet3.20
   description leaf6->leaf3 MGMT
   encapsulation dot1q vlan 20
   vrf MGMT
   ip address 10.21.36.2/30
!
interface Ethernet4.20
   description leaf6->leaf4 MGMT
   encapsulation dot1q vlan 20
   vrf MGMT
   ip address 10.21.46.2/30
!
interface Ethernet5.20
   description leaf6->leaf5 MGMT
   encapsulation dot1q vlan 20
   vrf MGMT
   ip address 10.21.56.2/30
!
ip routing
ip routing vrf PROD
ip routing vrf MGMT
!
route-map SET_COMMUNITY_DEFAULT permit 10
   set community 65006:10
!
route-map SET_COMMUNITY_PROD permit 10
   set community 65006:20
!
route-map SET_COMMUNITY_MGMT permit 10
   set community 65006:30
!
router bgp 65006
   router-id 10.0.0.6
   neighbor 10.1.16.1 remote-as 65001
   neighbor 10.1.16.1 description leaf1
   neighbor 10.1.16.1 send-community
   neighbor 10.1.26.1 remote-as 65002
   neighbor 10.1.26.1 description leaf2
   neighbor 10.1.26.1 send-community
   neighbor 10.1.36.1 remote-as 65003
   neighbor 10.1.36.1 description leaf3
   neighbor 10.1.36.1 send-community
   neighbor 10.1.46.1 remote-as 65004
   neighbor 10.1.46.1 description leaf4
   neighbor 10.1.46.1 send-community
   neighbor 10.1.56.1 remote-as 65005
   neighbor 10.1.56.1 description leaf5
   neighbor 10.1.56.1 send-community
   !
   address-family ipv4
      neighbor 10.1.16.1 activate
      neighbor 10.1.26.1 activate
      neighbor 10.1.36.1 activate
      neighbor 10.1.46.1 activate
      neighbor 10.1.56.1 activate
      network 10.0.0.6/32 route-map SET_COMMUNITY_DEFAULT
      network 10.0.1.6/32 route-map SET_COMMUNITY_DEFAULT
      network 10.0.2.6/32 route-map SET_COMMUNITY_DEFAULT
   !
   vrf PROD
      router-id 10.10.0.6
      neighbor 10.11.16.1 remote-as 65001
      neighbor 10.11.16.1 description leaf1-PROD
      neighbor 10.11.16.1 send-community
      neighbor 10.11.26.1 remote-as 65002
      neighbor 10.11.26.1 description leaf2-PROD
      neighbor 10.11.26.1 send-community
      neighbor 10.11.36.1 remote-as 65003
      neighbor 10.11.36.1 description leaf3-PROD
      neighbor 10.11.36.1 send-community
      neighbor 10.11.46.1 remote-as 65004
      neighbor 10.11.46.1 description leaf4-PROD
      neighbor 10.11.46.1 send-community
      neighbor 10.11.56.1 remote-as 65005
      neighbor 10.11.56.1 description leaf5-PROD
      neighbor 10.11.56.1 send-community
      !
      address-family ipv4
         neighbor 10.11.16.1 activate
         neighbor 10.11.26.1 activate
         neighbor 10.11.36.1 activate
         neighbor 10.11.46.1 activate
         neighbor 10.11.56.1 activate
         network 10.10.0.6/32 route-map SET_COMMUNITY_PROD
         network 10.10.1.6/32 route-map SET_COMMUNITY_PROD
         network 10.10.2.6/32 route-map SET_COMMUNITY_PROD
      !
   !
   vrf MGMT
      router-id 10.20.0.6
      neighbor 10.21.16.1 remote-as 65001
      neighbor 10.21.16.1 description leaf1-MGMT
      neighbor 10.21.16.1 send-community
      neighbor 10.21.26.1 remote-as 65002
      neighbor 10.21.26.1 description leaf2-MGMT
      neighbor 10.21.26.1 send-community
      neighbor 10.21.36.1 remote-as 65003
      neighbor 10.21.36.1 description leaf3-MGMT
      neighbor 10.21.36.1 send-community
      neighbor 10.21.46.1 remote-as 65004
      neighbor 10.21.46.1 description leaf4-MGMT
      neighbor 10.21.46.1 send-community
      neighbor 10.21.56.1 remote-as 65005
      neighbor 10.21.56.1 description leaf5-MGMT
      neighbor 10.21.56.1 send-community
      !
      address-family ipv4
         neighbor 10.21.16.1 activate
         neighbor 10.21.26.1 activate
         neighbor 10.21.36.1 activate
         neighbor 10.21.46.1 activate
         neighbor 10.21.56.1 activate
         network 10.20.0.6/32 route-map SET_COMMUNITY_MGMT
         network 10.20.1.6/32 route-map SET_COMMUNITY_MGMT
         network 10.20.2.6/32 route-map SET_COMMUNITY_MGMT
      !
!
