! leaf4 | AS 65004 | VRFs: default, PROD, MGMT
!
hostname leaf4
!
username admin privilege 15 role network-admin secret admin
!
management ssh
   no shutdown
!
vrf instance PROD
vrf instance MGMT
!
interface Loopback0
   ip address 10.0.0.4/32
interface Loopback1
   ip address 10.0.1.4/32
interface Loopback2
   ip address 10.0.2.4/32
!
interface Loopback10
   vrf PROD
   ip address 10.10.0.4/32
interface Loopback11
   vrf PROD
   ip address 10.10.1.4/32
interface Loopback12
   vrf PROD
   ip address 10.10.2.4/32
!
interface Loopback20
   vrf MGMT
   ip address 10.20.0.4/32
interface Loopback21
   vrf MGMT
   ip address 10.20.1.4/32
interface Loopback22
   vrf MGMT
   ip address 10.20.2.4/32
!
interface Ethernet1
   description leaf4->leaf1
   no switchport
   ip address 10.1.14.2/30
!
interface Ethernet2
   description leaf4->leaf2
   no switchport
   ip address 10.1.24.2/30
!
interface Ethernet3
   description leaf4->leaf3
   no switchport
   ip address 10.1.34.2/30
!
interface Ethernet4
   description leaf4->leaf5
   no switchport
   ip address 10.1.45.1/30
!
interface Ethernet5
   description leaf4->leaf6
   no switchport
   ip address 10.1.46.1/30
!
interface Ethernet1.10
   description leaf4->leaf1 PROD
   encapsulation dot1q vlan 10
   vrf PROD
   ip address 10.11.14.2/30
!
interface Ethernet2.10
   description leaf4->leaf2 PROD
   encapsulation dot1q vlan 10
   vrf PROD
   ip address 10.11.24.2/30
!
interface Ethernet3.10
   description leaf4->leaf3 PROD
   encapsulation dot1q vlan 10
   vrf PROD
   ip address 10.11.34.2/30
!
interface Ethernet4.10
   description leaf4->leaf5 PROD
   encapsulation dot1q vlan 10
   vrf PROD
   ip address 10.11.45.1/30
!
interface Ethernet5.10
   description leaf4->leaf6 PROD
   encapsulation dot1q vlan 10
   vrf PROD
   ip address 10.11.46.1/30
!
interface Ethernet1.20
   description leaf4->leaf1 MGMT
   encapsulation dot1q vlan 20
   vrf MGMT
   ip address 10.21.14.2/30
!
interface Ethernet2.20
   description leaf4->leaf2 MGMT
   encapsulation dot1q vlan 20
   vrf MGMT
   ip address 10.21.24.2/30
!
interface Ethernet3.20
   description leaf4->leaf3 MGMT
   encapsulation dot1q vlan 20
   vrf MGMT
   ip address 10.21.34.2/30
!
interface Ethernet4.20
   description leaf4->leaf5 MGMT
   encapsulation dot1q vlan 20
   vrf MGMT
   ip address 10.21.45.1/30
!
interface Ethernet5.20
   description leaf4->leaf6 MGMT
   encapsulation dot1q vlan 20
   vrf MGMT
   ip address 10.21.46.1/30
!
ip routing
ip routing vrf PROD
ip routing vrf MGMT
!
router bgp 65004
   router-id 10.0.0.4
   neighbor 10.1.14.1 remote-as 65001
   neighbor 10.1.14.1 description leaf1
   neighbor 10.1.24.1 remote-as 65002
   neighbor 10.1.24.1 description leaf2
   neighbor 10.1.34.1 remote-as 65003
   neighbor 10.1.34.1 description leaf3
   neighbor 10.1.45.2 remote-as 65005
   neighbor 10.1.45.2 description leaf5
   neighbor 10.1.46.2 remote-as 65006
   neighbor 10.1.46.2 description leaf6
   !
   address-family ipv4
      neighbor 10.1.14.1 activate
      neighbor 10.1.24.1 activate
      neighbor 10.1.34.1 activate
      neighbor 10.1.45.2 activate
      neighbor 10.1.46.2 activate
      network 10.0.0.4/32
      network 10.0.1.4/32
      network 10.0.2.4/32
   !
   !
   vrf PROD
      router-id 10.10.0.4
      neighbor 10.11.14.1 remote-as 65001
      neighbor 10.11.14.1 description leaf1-PROD
      neighbor 10.11.24.1 remote-as 65002
      neighbor 10.11.24.1 description leaf2-PROD
      neighbor 10.11.34.1 remote-as 65003
      neighbor 10.11.34.1 description leaf3-PROD
      neighbor 10.11.45.2 remote-as 65005
      neighbor 10.11.45.2 description leaf5-PROD
      neighbor 10.11.46.2 remote-as 65006
      neighbor 10.11.46.2 description leaf6-PROD
      !
      address-family ipv4
         neighbor 10.11.14.1 activate
         neighbor 10.11.24.1 activate
         neighbor 10.11.34.1 activate
         neighbor 10.11.45.2 activate
         neighbor 10.11.46.2 activate
         network 10.10.0.4/32
         network 10.10.1.4/32
         network 10.10.2.4/32
      !
   !
   vrf MGMT
      router-id 10.20.0.4
      neighbor 10.21.14.1 remote-as 65001
      neighbor 10.21.14.1 description leaf1-MGMT
      neighbor 10.21.24.1 remote-as 65002
      neighbor 10.21.24.1 description leaf2-MGMT
      neighbor 10.21.34.1 remote-as 65003
      neighbor 10.21.34.1 description leaf3-MGMT
      neighbor 10.21.45.2 remote-as 65005
      neighbor 10.21.45.2 description leaf5-MGMT
      neighbor 10.21.46.2 remote-as 65006
      neighbor 10.21.46.2 description leaf6-MGMT
      !
      address-family ipv4
         neighbor 10.21.14.1 activate
         neighbor 10.21.24.1 activate
         neighbor 10.21.34.1 activate
         neighbor 10.21.45.2 activate
         neighbor 10.21.46.2 activate
         network 10.20.0.4/32
         network 10.20.1.4/32
         network 10.20.2.4/32
      !
!
