! leaf3 | AS 65003 | VRFs: default, PROD, MGMT
!
hostname leaf3
!
username admin privilege 15 role network-admin secret admin
!
management ssh
   no shutdown
!
vrf instance PROD
vrf instance MGMT
!
interface Loopback0
   ip address 10.0.0.3/32
interface Loopback1
   ip address 10.0.1.3/32
interface Loopback2
   ip address 10.0.2.3/32
!
interface Loopback10
   vrf PROD
   ip address 10.10.0.3/32
interface Loopback11
   vrf PROD
   ip address 10.10.1.3/32
interface Loopback12
   vrf PROD
   ip address 10.10.2.3/32
!
interface Loopback20
   vrf MGMT
   ip address 10.20.0.3/32
interface Loopback21
   vrf MGMT
   ip address 10.20.1.3/32
interface Loopback22
   vrf MGMT
   ip address 10.20.2.3/32
!
interface Ethernet1
   description leaf3->leaf1
   no switchport
   ip address 10.1.13.2/30
!
interface Ethernet2
   description leaf3->leaf2
   no switchport
   ip address 10.1.23.2/30
!
interface Ethernet3
   description leaf3->leaf4
   no switchport
   ip address 10.1.34.1/30
!
interface Ethernet4
   description leaf3->leaf5
   no switchport
   ip address 10.1.35.1/30
!
interface Ethernet5
   description leaf3->leaf6
   no switchport
   ip address 10.1.36.1/30
!
interface Ethernet1.10
   description leaf3->leaf1 PROD
   encapsulation dot1q vlan 10
   vrf PROD
   ip address 10.11.13.2/30
!
interface Ethernet2.10
   description leaf3->leaf2 PROD
   encapsulation dot1q vlan 10
   vrf PROD
   ip address 10.11.23.2/30
!
interface Ethernet3.10
   description leaf3->leaf4 PROD
   encapsulation dot1q vlan 10
   vrf PROD
   ip address 10.11.34.1/30
!
interface Ethernet4.10
   description leaf3->leaf5 PROD
   encapsulation dot1q vlan 10
   vrf PROD
   ip address 10.11.35.1/30
!
interface Ethernet5.10
   description leaf3->leaf6 PROD
   encapsulation dot1q vlan 10
   vrf PROD
   ip address 10.11.36.1/30
!
interface Ethernet1.20
   description leaf3->leaf1 MGMT
   encapsulation dot1q vlan 20
   vrf MGMT
   ip address 10.21.13.2/30
!
interface Ethernet2.20
   description leaf3->leaf2 MGMT
   encapsulation dot1q vlan 20
   vrf MGMT
   ip address 10.21.23.2/30
!
interface Ethernet3.20
   description leaf3->leaf4 MGMT
   encapsulation dot1q vlan 20
   vrf MGMT
   ip address 10.21.34.1/30
!
interface Ethernet4.20
   description leaf3->leaf5 MGMT
   encapsulation dot1q vlan 20
   vrf MGMT
   ip address 10.21.35.1/30
!
interface Ethernet5.20
   description leaf3->leaf6 MGMT
   encapsulation dot1q vlan 20
   vrf MGMT
   ip address 10.21.36.1/30
!
ip routing
ip routing vrf PROD
ip routing vrf MGMT
!
route-map SET_COMMUNITY_DEFAULT permit 10
   set community 65003:10
!
route-map SET_COMMUNITY_PROD permit 10
   set community 65003:20
!
route-map SET_COMMUNITY_MGMT permit 10
   set community 65003:30
!
router bgp 65003
   router-id 10.0.0.3
   neighbor 10.1.13.1 remote-as 65001
   neighbor 10.1.13.1 description leaf1
   neighbor 10.1.13.1 send-community
   neighbor 10.1.23.1 remote-as 65002
   neighbor 10.1.23.1 description leaf2
   neighbor 10.1.23.1 send-community
   neighbor 10.1.34.2 remote-as 65004
   neighbor 10.1.34.2 description leaf4
   neighbor 10.1.34.2 send-community
   neighbor 10.1.35.2 remote-as 65005
   neighbor 10.1.35.2 description leaf5
   neighbor 10.1.35.2 send-community
   neighbor 10.1.36.2 remote-as 65006
   neighbor 10.1.36.2 description leaf6
   neighbor 10.1.36.2 send-community
   !
   address-family ipv4
      neighbor 10.1.13.1 activate
      neighbor 10.1.23.1 activate
      neighbor 10.1.34.2 activate
      neighbor 10.1.35.2 activate
      neighbor 10.1.36.2 activate
      network 10.0.0.3/32 route-map SET_COMMUNITY_DEFAULT
      network 10.0.1.3/32 route-map SET_COMMUNITY_DEFAULT
      network 10.0.2.3/32 route-map SET_COMMUNITY_DEFAULT
   !
   vrf PROD
      router-id 10.10.0.3
      neighbor 10.11.13.1 remote-as 65001
      neighbor 10.11.13.1 description leaf1-PROD
      neighbor 10.11.13.1 send-community
      neighbor 10.11.23.1 remote-as 65002
      neighbor 10.11.23.1 description leaf2-PROD
      neighbor 10.11.23.1 send-community
      neighbor 10.11.34.2 remote-as 65004
      neighbor 10.11.34.2 description leaf4-PROD
      neighbor 10.11.34.2 send-community
      neighbor 10.11.35.2 remote-as 65005
      neighbor 10.11.35.2 description leaf5-PROD
      neighbor 10.11.35.2 send-community
      neighbor 10.11.36.2 remote-as 65006
      neighbor 10.11.36.2 description leaf6-PROD
      neighbor 10.11.36.2 send-community
      !
      address-family ipv4
         neighbor 10.11.13.1 activate
         neighbor 10.11.23.1 activate
         neighbor 10.11.34.2 activate
         neighbor 10.11.35.2 activate
         neighbor 10.11.36.2 activate
         network 10.10.0.3/32 route-map SET_COMMUNITY_PROD
         network 10.10.1.3/32 route-map SET_COMMUNITY_PROD
         network 10.10.2.3/32 route-map SET_COMMUNITY_PROD
      !
   !
   vrf MGMT
      router-id 10.20.0.3
      neighbor 10.21.13.1 remote-as 65001
      neighbor 10.21.13.1 description leaf1-MGMT
      neighbor 10.21.13.1 send-community
      neighbor 10.21.23.1 remote-as 65002
      neighbor 10.21.23.1 description leaf2-MGMT
      neighbor 10.21.23.1 send-community
      neighbor 10.21.34.2 remote-as 65004
      neighbor 10.21.34.2 description leaf4-MGMT
      neighbor 10.21.34.2 send-community
      neighbor 10.21.35.2 remote-as 65005
      neighbor 10.21.35.2 description leaf5-MGMT
      neighbor 10.21.35.2 send-community
      neighbor 10.21.36.2 remote-as 65006
      neighbor 10.21.36.2 description leaf6-MGMT
      neighbor 10.21.36.2 send-community
      !
      address-family ipv4
         neighbor 10.21.13.1 activate
         neighbor 10.21.23.1 activate
         neighbor 10.21.34.2 activate
         neighbor 10.21.35.2 activate
         neighbor 10.21.36.2 activate
         network 10.20.0.3/32 route-map SET_COMMUNITY_MGMT
         network 10.20.1.3/32 route-map SET_COMMUNITY_MGMT
         network 10.20.2.3/32 route-map SET_COMMUNITY_MGMT
      !
!
