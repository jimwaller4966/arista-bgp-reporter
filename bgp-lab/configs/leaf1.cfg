! leaf1 | AS 65001 | VRFs: default, PROD, MGMT
!
hostname leaf1
!
vrf instance PROD
vrf instance MGMT
!
! ── Loopbacks — default VRF ──────────────────────────────────────
interface Loopback0
   ip address 10.0.0.1/32
interface Loopback1
   ip address 10.0.1.1/32
interface Loopback2
   ip address 10.0.2.1/32
!
! ── Loopbacks — PROD VRF ─────────────────────────────────────────
interface Loopback10
   vrf PROD
   ip address 10.10.0.1/32
interface Loopback11
   vrf PROD
   ip address 10.10.1.1/32
interface Loopback12
   vrf PROD
   ip address 10.10.2.1/32
!
! ── Loopbacks — MGMT VRF ─────────────────────────────────────────
interface Loopback20
   vrf MGMT
   ip address 10.20.0.1/32
interface Loopback21
   vrf MGMT
   ip address 10.20.1.1/32
interface Loopback22
   vrf MGMT
   ip address 10.20.2.1/32
!
! ── P2P links ─────────────────────────────────────────────────────
interface Ethernet1
   description leaf1->leaf2
   no switchport
   ip address 10.1.12.1/30
interface Ethernet2
   description leaf1->leaf3
   no switchport
   ip address 10.1.13.1/30
interface Ethernet3
   description leaf1->leaf4
   no switchport
   ip address 10.1.14.1/30
interface Ethernet4
   description leaf1->leaf5
   no switchport
   ip address 10.1.15.1/30
interface Ethernet5
   description leaf1->leaf6
   no switchport
   ip address 10.1.16.1/30
!
ip routing
ip routing vrf PROD
ip routing vrf MGMT
!
! ── Default VRF BGP ───────────────────────────────────────────────
router bgp 65001
   router-id 10.0.0.1
   neighbor 10.1.12.2 remote-as 65002
   neighbor 10.1.12.2 description leaf2
   neighbor 10.1.13.2 remote-as 65003
   neighbor 10.1.13.2 description leaf3
   neighbor 10.1.14.2 remote-as 65004
   neighbor 10.1.14.2 description leaf4
   neighbor 10.1.15.2 remote-as 65005
   neighbor 10.1.15.2 description leaf5
   neighbor 10.1.16.2 remote-as 65006
   neighbor 10.1.16.2 description leaf6
   !
   address-family ipv4
      neighbor 10.1.12.2 activate
      neighbor 10.1.13.2 activate
      neighbor 10.1.14.2 activate
      neighbor 10.1.15.2 activate
      neighbor 10.1.16.2 activate
      network 10.0.0.1/32
      network 10.0.1.1/32
      network 10.0.2.1/32
   !
   ! ── PROD VRF ─────────────────────────────────────────────────
   vrf PROD
      router-id 10.10.0.1
      neighbor 10.1.12.2 remote-as 65002
      neighbor 10.1.12.2 description leaf2-PROD
      neighbor 10.1.13.2 remote-as 65003
      neighbor 10.1.13.2 description leaf3-PROD
      neighbor 10.1.14.2 remote-as 65004
      neighbor 10.1.14.2 description leaf4-PROD
      neighbor 10.1.15.2 remote-as 65005
      neighbor 10.1.15.2 description leaf5-PROD
      neighbor 10.1.16.2 remote-as 65006
      neighbor 10.1.16.2 description leaf6-PROD
      !
      address-family ipv4
         neighbor 10.1.12.2 activate
         neighbor 10.1.13.2 activate
         neighbor 10.1.14.2 activate
         neighbor 10.1.15.2 activate
         neighbor 10.1.16.2 activate
         network 10.10.0.1/32
         network 10.10.1.1/32
         network 10.10.2.1/32
   !
   ! ── MGMT VRF ─────────────────────────────────────────────────
   vrf MGMT
      router-id 10.20.0.1
      neighbor 10.1.12.2 remote-as 65002
      neighbor 10.1.12.2 description leaf2-MGMT
      neighbor 10.1.13.2 remote-as 65003
      neighbor 10.1.13.2 description leaf3-MGMT
      neighbor 10.1.14.2 remote-as 65004
      neighbor 10.1.14.2 description leaf4-MGMT
      neighbor 10.1.15.2 remote-as 65005
      neighbor 10.1.15.2 description leaf5-MGMT
      neighbor 10.1.16.2 remote-as 65006
      neighbor 10.1.16.2 description leaf6-MGMT
      !
      address-family ipv4
         neighbor 10.1.12.2 activate
         neighbor 10.1.13.2 activate
         neighbor 10.1.14.2 activate
         neighbor 10.1.15.2 activate
         neighbor 10.1.16.2 activate
         network 10.20.0.1/32
         network 10.20.1.1/32
         network 10.20.2.1/32
!
