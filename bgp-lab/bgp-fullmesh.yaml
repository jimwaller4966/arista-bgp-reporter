name: bgp-fullmesh

mgmt:
  network: mgmt
  ipv4-subnet: 172.20.20.0/24

topology:
  defaults:
    kind: ceos
    image: ceosimage:4.36.0.1F

  nodes:
    leaf1:
      mgmt-ipv4: 172.20.20.11
      startup-config: configs/leaf1.cfg
    leaf2:
      mgmt-ipv4: 172.20.20.12
      startup-config: configs/leaf2.cfg
    leaf3:
      mgmt-ipv4: 172.20.20.13
      startup-config: configs/leaf3.cfg
    leaf4:
      mgmt-ipv4: 172.20.20.14
      startup-config: configs/leaf4.cfg
    leaf5:
      mgmt-ipv4: 172.20.20.15
      startup-config: configs/leaf5.cfg
    leaf6:
      mgmt-ipv4: 172.20.20.16
      startup-config: configs/leaf6.cfg

  links:
    # leaf1 to all
    - endpoints: ["leaf1:eth1", "leaf2:eth1"]
    - endpoints: ["leaf1:eth2", "leaf3:eth1"]
    - endpoints: ["leaf1:eth3", "leaf4:eth1"]
    - endpoints: ["leaf1:eth4", "leaf5:eth1"]
    - endpoints: ["leaf1:eth5", "leaf6:eth1"]
    # leaf2 to remaining
    - endpoints: ["leaf2:eth2", "leaf3:eth2"]
    - endpoints: ["leaf2:eth3", "leaf4:eth2"]
    - endpoints: ["leaf2:eth4", "leaf5:eth2"]
    - endpoints: ["leaf2:eth5", "leaf6:eth2"]
    # leaf3 to remaining
    - endpoints: ["leaf3:eth3", "leaf4:eth3"]
    - endpoints: ["leaf3:eth4", "leaf5:eth3"]
    - endpoints: ["leaf3:eth5", "leaf6:eth3"]
    # leaf4 to remaining
    - endpoints: ["leaf4:eth4", "leaf5:eth4"]
    - endpoints: ["leaf4:eth5", "leaf6:eth4"]
    # leaf5 to leaf6
    - endpoints: ["leaf5:eth5", "leaf6:eth5"]
